<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尺寸链分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .container {
            max-width: 1600px;
            margin: 10px auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 10px;
            height: calc(100vh - 60px);
            min-height: 600px;
            align-items: start;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            overflow-y: auto;
        }
        
        .center-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            overflow-y: auto;
            position: sticky;
            top: 0;
        }
        
        .panel {
            background: white;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 12px;
        }
        
        .panel-compact {
            padding: 10px;
        }
        
        .panel-compact .panel-title {
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 6px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 6px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8eeff;
        }

        .upload-icon {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .upload-text {
            color: #666;
            font-size: 11px;
            line-height: 1.4;
        }

        #fileInput {
            display: none;
        }

        /* 控制组 */
        .control-group {
            margin-bottom: 10px;
        }

        .control-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .btn.primary {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .btn.primary:hover {
            background: #5a6fd6;
        }

        .btn.success {
            background: #52c41a;
            border-color: #52c41a;
            color: white;
        }

        .btn.success:hover {
            background: #49ad17;
        }

        .btn.danger {
            background: #ff4d4f;
            border-color: #ff4d4f;
            color: white;
        }

        .btn.danger:hover {
            background: #e64447;
        }

        .btn.full {
            width: 100%;
            margin-bottom: 6px;
        }

        /* 画布区域 */
        .canvas-wrapper {
            flex: 1;
            position: relative;
            cursor: crosshair;
            overflow: auto;
            background: #f8f9fa;
            border-radius: 4px;
            min-height: 0;
        }
        
        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        #imageCanvas {
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            /* 禁止CSS缩放，保持原始比例 */
            width: auto !important;
            height: auto !important;
            max-width: none;
            max-height: none;
        }

        .empty-state {
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* 点列表 */
        .point-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .point-item {
            display: flex;
            align-items: center;
            padding: 6px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
        }

        .point-item:last-child {
            border-bottom: none;
        }

        .point-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .point-info {
            flex: 1;
        }

        .point-coords {
            color: #999;
            font-size: 10px;
        }

        .point-delete {
            color: #ff4d4f;
            cursor: pointer;
            padding: 2px;
        }

        /* 结果区域 */
        .result-box {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        .result-box.error {
            background: #fff2f0;
            border-color: #ffccc7;
        }

        /* 尺寸链信息 */
        .chain-info {
            background: #f6ffed;
            border-radius: 4px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
        }

        .chain-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed #d9f7be;
        }

        .chain-row:last-child {
            border-bottom: none;
        }

        /* 尺寸代号输入 */
        .dimension-inputs {
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
            border-radius: 4px;
            margin-top: 8px;
        }

        .dimension-row {
            display: flex;
            align-items: center;
            padding: 3px 0;
            font-size: 11px;
        }

        .dimension-label {
            min-width: 35px;
            font-weight: bold;
            color: #1890ff;
        }

        .dimension-input {
            flex: 1;
            padding: 3px 5px;
            border: 1px solid #d9d9d9;
            border-radius: 3px;
            font-size: 11px;
            width: 45px;
        }

        .dimension-input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }

        .tolerance-input {
            width: 40px;
            min-width: 40px;
        }

        /* 尺寸代号面板占1/2高度 */
        .dimension-panel-large {
            flex: none;
            height: 50vh;
            min-height: 200px;
        }

        .dimension-panel-large .dimension-inputs {
            max-height: none;
            height: calc(100% - 40px);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📐 尺寸链分析工具</h1>
    </div>

    <div class="container">
        <!-- 左侧面板：图像上传 + 标注控制 + 标注点列表 + 尺寸链信息 -->
        <div class="left-panel">
            <!-- 图像上传 -->
            <div class="panel panel-compact">
                <div class="panel-title">📷 图像上传</div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">
                        点击上传图像<br>或拖拽文件到此处
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
                
                <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e8e8e8;">
                    <div class="panel-title" style="font-size: 12px; margin-bottom: 6px;">📂 加载数据</div>
                    <div class="upload-area" id="loadDataArea" style="padding: 10px;">
                        <div class="upload-icon" style="font-size: 20px;">📥</div>
                        <div class="upload-text" style="font-size: 10px;">
                            点击加载JSON数据文件
                        </div>
                    </div>
                    <input type="file" id="dataFileInput" accept=".json,application/json" style="display: none;">
                </div>
            </div>

            <!-- 标注控制 -->
            <div class="panel panel-compact">
                <div class="panel-title">✏️ 标注模式</div>
                
                <div class="control-group">
                    <label class="control-label">链方向</label>
                    <div class="btn-group">
                        <button class="btn active" data-direction="horizontal" id="btnHorizontal">X向</button>
                        <button class="btn" data-direction="vertical" id="btnVertical">Y向</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">标注类型</label>
                    <div class="btn-group">
                        <button class="btn active" data-mode="normal" id="btnNormal">普通/起止</button>
                        <button class="btn" data-mode="axisHole" id="btnAxisHole">轴孔</button>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                    <button class="btn primary" id="btnGenerate">✨ 生成</button>
                    <button class="btn danger" id="btnClear">清空</button>
                </div>

                <div class="control-group" style="margin-top: 8px;">
                    <label class="control-label">缩放</label>
                    <div class="btn-group">
                        <button class="btn" id="btnZoomIn">+</button>
                        <button class="btn" id="btnZoomOut">-</button>
                        <button class="btn" id="btnZoomReset">重置</button>
                    </div>
                </div>
            </div>

            <!-- 标注点列表 -->
            <div class="panel panel-compact">
                <div class="panel-title">📋 标注点列表</div>
                <div class="point-list" id="pointList">
                    <p style="color: #999; text-align: center; padding: 10px; font-size: 12px;">暂无标注点</p>
                </div>
            </div>

            <!-- 尺寸链信息 -->
            <div class="panel panel-compact">
                <div class="panel-title">📐 尺寸链信息</div>
                <div id="chainInfo">
                    <p style="color: #999; text-align: center; padding: 10px; font-size: 12px;">请先生成尺寸链</p>
                </div>
            </div>
        </div>

        <!-- 中间面板：图像预览（大区域） -->
        <div class="center-panel">
            <div class="panel" style="height: 100%; display: flex; flex-direction: column; padding: 10px;">
                <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px;">
                    <span>🎨 图像预览</span>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="projectName" placeholder="项目+零件名称" style="padding: 4px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; width: 180px;" onchange="updateProjectName(this.value)">
                        <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; color: #666; font-weight: normal;">
                            <input type="checkbox" id="togglePoints" checked>
                            显示点
                        </label>
                        <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; color: #666; font-weight: normal;">
                            <input type="checkbox" id="toggleLines" checked>
                            显示线
                        </label>
                    </div>
                </div>
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-icon">🖼️</div>
                        <p>请上传图像开始标注</p>
                    </div>
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="imageCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧面板：尺寸代号（占2/3）+ 计算结果 + 导出 -->
        <div class="right-panel">
            <!-- 尺寸代号输入 - 占据2/3高度 -->
            <div class="panel panel-compact dimension-panel-large">
                <div class="panel-title">📏 尺寸代号</div>
                <div id="dimensionInputs" class="dimension-inputs">
                    <p style="color: #999; text-align: center; padding: 8px; font-size: 12px;">请先生成尺寸链</p>
                </div>
            </div>

            <!-- 计算结果 -->
            <div class="panel panel-compact">
                <div class="panel-title">🧮 封闭环 X 计算结果</div>
                <button class="btn success full" id="btnCalculate" style="margin-bottom: 8px; font-size: 12px; padding: 8px;">
                    🚀 开始计算
                </button>
                <div id="resultBox" style="color: #999; text-align: center; padding: 8px; font-size: 12px;">
                    点击按钮进行计算
                </div>
            </div>

            <!-- 导出按钮 -->
            <div class="panel panel-compact">
                <div class="panel-title">💾 导出</div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn success" id="btnExportImage" style="flex: 1; font-size: 12px; padding: 6px;">导出图像</button>
                    <button class="btn" id="btnExportData" style="flex: 1; font-size: 12px; padding: 6px;">导出数据</button>
                </div>
            </div>

            <!-- 帮助文档 -->
            <div class="panel panel-compact">
                <div class="panel-title">📖 帮助</div>
                <button class="btn" id="btnHelp" style="width: 100%; font-size: 12px; padding: 8px;">
                    查看使用说明
                </button>
            </div>
        </div>
    </div>

    <!-- 使用说明弹窗 -->
    <div id="helpModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 800px; height: 90%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden;">
            <div style="padding: 15px 20px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; background: #f5f5f5;">
                <h2 style="font-size: 18px; margin: 0; color: #333;">📐 尺寸链分析工具使用说明书</h2>
                <button id="btnCloseHelp" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
            </div>
            <div id="helpContent" style="flex: 1; padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.6;">
                <!-- 使用说明内容将通过JS动态加载 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
